<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  @page {
    size: 90mm 50mm;
    margin: 0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 90mm;
    height: 50mm;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }

  /* ===== ЛИЦЕВАЯ СТОРОНА ===== */
  .front {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 8mm;
  }

  .front .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18pt;
    color: #ffffff;
    letter-spacing: 3pt;
    text-transform: uppercase;
    margin-bottom: 1mm;
  }

  .front .logo-text .accent {
    color: #E87A20;
  }

  .front .company-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 6pt;
    color: #888;
    letter-spacing: 3pt;
    text-transform: uppercase;
  }

  .front .tagline {
    font-size: 5pt;
    color: #E87A20;
    margin-top: 2mm;
    letter-spacing: 0.5pt;
  }

  .front .accent-line {
    width: 15mm;
    height: 0.5mm;
    background: #E87A20;
    margin-top: 2.5mm;
  }

  /* ===== ОБОРОТНАЯ СТОРОНА ===== */
  .back {
    background: #ffffff;
    padding: 5mm 6mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .back .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .back .person-info {
    flex: 1;
  }

  .back .person-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 8pt;
    color: #1a1a1a;
  }

  .back .person-title {
    font-size: 5.5pt;
    color: #E87A20;
    font-weight: 600;
    margin-top: 0.5mm;
  }

  .back .logo-small {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 8pt;
    color: #1a1a1a;
    letter-spacing: 1.5pt;
    text-align: right;
    line-height: 1.2;
  }

  .back .logo-small .accent {
    color: #E87A20;
  }

  .back .divider {
    width: 100%;
    height: 0.3mm;
    background: #e5e5e5;
    margin: 2mm 0;
  }

  .back .contacts {
    display: flex;
    flex-direction: column;
    gap: 1.2mm;
  }

  .back .contact-row {
    display: flex;
    align-items: center;
    gap: 2mm;
    font-size: 5.5pt;
    color: #444;
  }

  .back .contact-icon {
    width: 2.5mm;
    height: 2.5mm;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .back .contact-icon svg {
    width: 100%;
    height: 100%;
  }

  .back .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .back .services {
    font-size: 4.5pt;
    color: #999;
    line-height: 1.6;
  }

  .back .brand-corner {
    width: 8mm;
    height: 2mm;
    background: #E87A20;
    border-radius: 1mm 0 0 0;
    position: absolute;
    bottom: 0;
    right: 0;
  }
</style>
</head>
<body>

<!-- ЛИЦЕВАЯ СТОРОНА -->
<div class="card front">
  <div class="logo-text"><span class="accent">SOD</span> EAST</div>
  <div class="company-name">TRADE HOUSE</div>
  <div class="accent-line"></div>
  <div class="tagline">Оборудование и инженерные решения для промышленности</div>
</div>

<!-- ОБОРОТНАЯ СТОРОНА -->
<div class="card back">
  <div class="top-bar">
    <div class="person-info">
      <div class="person-name">Имя Фамилия</div>
      <div class="person-title">Должность</div>
    </div>
    <div class="logo-small"><span class="accent">SOD</span> EAST<br>TRADE HOUSE</div>
  </div>

  <div class="divider"></div>

  <div class="contacts">
    <div class="contact-row">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E87A20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <span>+998 93 182 20 54</span>
    </div>
    <div class="contact-row">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E87A20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <span>sod.trade.house@gmail.com</span>
    </div>
    <div class="contact-row">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E87A20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <span>Ташкент, Узбекистан</span>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="services">
      Поставка оборудования · Монтаж · Инженеринг · Сервис
    </div>
  </div>
  <div class="brand-corner"></div>
</div>

</body>
</html>
